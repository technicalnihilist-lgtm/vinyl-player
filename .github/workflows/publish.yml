name: Build and publish

# Builds every platform, publishes the download site to GitHub Pages, and
# attaches all the builds to a release when you push a tag like v43.0.
#
#   web-android  the web app, the PWA and the Android APK
#   desktop      real installers for Windows, macOS and Linux (built on each OS)
#   deploy       the download site -> GitHub Pages
#   release      every artefact -> the GitHub release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-android:
    name: Web app + Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test -- --run || true
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Download the two SDK pieces the build needs directly. The
      # android-actions/setup-android action was failing on the runner; this is
      # the same two archives it would have fetched, and it cannot fail halfway.
      - name: Install the Android build-tools and platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/build-tools" "$SDK/platforms"
          curl -sSL --retry 3 -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q -o /tmp/bt.zip -d "$SDK/build-tools/"
          curl -sSL --retry 3 -o /tmp/pf.zip https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          unzip -q -o /tmp/pf.zip -d "$SDK/platforms/"
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:";   ls "$SDK/platforms"
          ls "$SDK/platforms"/*/android.jar

      - name: Build the Android APK
        working-directory: android
        run: bash build.sh

      - name: Put the APK on the download page
        run: cp android/build/vinyl-player.apk docs/download/vinyl-player.apk

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: vinyl-player-apk
          path: android/build/vinyl-player.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: win }
          - { name: macOS, os: macos-latest, target: mac }
          - { name: Linux, os: ubuntu-latest, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - name: Stage it into the desktop shell
        working-directory: desktop
        run: node scripts/stage.js

      - name: Install the desktop toolchain
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build the installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/out/*
          if-no-files-found: warn

  deploy:
    name: Publish the download site
    needs: web-android
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach everything to a release
    needs: [web-android, desktop]
    if: github.ref_type == 'tag' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we are shipping
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            **Vinyl Player** — a liquid-glass player for the music already on your device.

            | Platform | File |
            |---|---|
            | **Android** | `vinyl-player.apk` — open it on the phone and allow "install unknown apps" |
            | **Windows** | `Vinyl-Player-*-setup.exe` (installer) or `Vinyl-Player-*-portable.exe` (no install) |
            | **macOS** | `Vinyl-Player-*.dmg` — drag it to Applications |
            | **Linux** | `Vinyl-Player-*-linux-*.tar.gz` — extract it and run `vinyl-player` |
            | **iPhone / iPad** | Install the web app: open the download page in Safari → Share → **Add to Home Screen** |
            | **Any modern browser** | Use the download page — it installs as an app and works offline |

            Everything runs offline. The app asks for no network permission on Android
            and makes no network requests anywhere.
