name: Build and publish

# Builds the web app and the APK, publishes the download site to GitHub Pages,
# and attaches the APK to a release whenever you push a tag like v43.0.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test -- --run || true
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.ref_type == 'tag' && github.ref_name || '43' }}
        run: |
          VERSION_CODE="$(echo "${VERSION_CODE}" | tr -dc '0-9')"
          [ -n "$VERSION_CODE" ] || VERSION_CODE=43
          VERSION_NAME="$VERSION_CODE.0" bash build.sh

      - name: Put the APK on the download page
        run: cp android/build/vinyl-player.apk docs/download/vinyl-player.apk

      - name: Keep the APK as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: vinyl-player-apk
          path: android/build/vinyl-player.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Publish the download site
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach the APK to a release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vinyl-player-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: vinyl-player.apk
          generate_release_notes: true
          body: |
            **Vinyl Player** — a liquid-glass player for the music already on your phone.

            Download `vinyl-player.apk` below and open it on your Android device.
            Allow "install unknown apps" when Android asks.
