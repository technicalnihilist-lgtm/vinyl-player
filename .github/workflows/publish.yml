name: Build and publish

# Builds every platform and attaches the results to a release when you push a
# tag like v43.0.
#
#   web-android  the web app, the PWA and the Android APK
#   desktop      real installers for Windows, macOS and Linux, built on each OS
#   release      every artefact -> the GitHub release
#
# The download site is served by GitHub Pages straight from docs/ on main
# (Settings -> Pages -> Deploy from a branch -> main / docs), so it does not
# need a job here.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to publish to'
        required: true
        default: production
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-android:
    name: Web app + Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test -- --run || true
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fetch the two SDK pieces the build needs directly. The
      # android-actions/setup-android action was failing on the runner before it
      # downloaded anything; this is the same two archives it would have used.
      - name: Install the Android build-tools and platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/build-tools" "$SDK/platforms"
          curl -sSL --retry 3 -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q -o /tmp/bt.zip -d "$SDK/build-tools/"
          curl -sSL --retry 3 -o /tmp/pf.zip https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          unzip -q -o /tmp/pf.zip -d "$SDK/platforms/"
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:";   ls "$SDK/platforms"
          ls "$SDK/platforms"/*/android.jar

      - name: Build the Android APK
        working-directory: android
        run: bash build.sh

      - name: Fetch bundletool
        run: |
          curl -sSL --retry 3 -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "BUNDLETOOL=$PWD/bundletool.jar" >> "$GITHUB_ENV"

      # Play takes an App Bundle, so build one alongside the APK.
      - name: Build the Android App Bundle
        working-directory: android
        run: BUNDLETOOL="$BUNDLETOOL" bash build-aab.sh

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/build/vinyl-player.apk
            android/build/vinyl-player.aab

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One arch per job: building both mac arches in a single job makes the
          # second DMG fail, because the first one's volume is still mounted.
          - { name: Windows, os: windows-latest, target: win, arch: x64 }
          - { name: macOS Intel, os: macos-latest, target: mac, arch: x64 }
          - { name: macOS Apple silicon, os: macos-latest, target: mac, arch: arm64 }
          - { name: Linux, os: ubuntu-latest, target: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - name: Stage it into the desktop shell
        working-directory: desktop
        run: node scripts/stage.js

      - name: Install the desktop toolchain
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build the installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          # Only the finished installers — electron-builder also leaves whole
          # unpacked app directories in out/, and those must not reach a release.
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.tar.gz
          if-no-files-found: warn

  # Uploads the App Bundle to Google Play, so a release here becomes an update
  # there without anyone opening Play Console.
  #
  # It stays green until you have set the secret up: if PLAY_SERVICE_ACCOUNT_JSON
  # is missing the step is skipped and says so, rather than failing the build.
  #
  # The very first release of an app cannot go through the API — Google requires
  # that one to be uploaded by hand in Play Console. Everything after it can come
  # from here. See docs/PLAY-STORE.md.
  play:
    name: Upload to Google Play
    needs: web-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: bundle

      - name: Is a service account configured?
        id: guard
        run: |
          if [ -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Play upload skipped::PLAY_SERVICE_ACCOUNT_JSON is not set. See docs/PLAY-STORE.md to turn this on."
          fi

      - name: Upload the App Bundle
        if: steps.guard.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hubclue.vinylplayer
          releaseFiles: bundle/vinyl-player.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

  release:
    name: Attach everything to a release
    needs: [web-android, desktop]
    if: github.ref_type == 'tag' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we are shipping
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            **Vinyl Player** — a liquid-glass player for the music already on your device.

            | Platform | File |
            |---|---|
            | **Android** | `vinyl-player.apk` — open it on the phone and allow "install unknown apps" |
            | **Windows** | `Vinyl Player Setup *.exe` (installer) or `Vinyl-Player-*-portable.exe` (no install) |
            | **macOS** | `Vinyl-Player-*-x64.dmg` (Intel) or `*-arm64.dmg` (Apple silicon) — drag to Applications |
            | **Linux** | `Vinyl-Player-*-linux-*.tar.gz` — extract it and run `vinyl-player` |
            | **iPhone / iPad** | Open the download page in Safari → Share → **Add to Home Screen** |
            | **Any modern browser** | Use the download page — it installs as an app and works offline |

            Everything runs offline. The Android app asks for no network permission and
            makes no network requests anywhere.
